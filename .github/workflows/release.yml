# Tag vX.Y.Z → tested, compiled linux binaries + signed SHA256SUMS on a GitHub release.
# The version baked into the binary (VERSION in src/shared/config.ts) is read from
# package.json at compile time, so the tag is written there before building.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Required reviewer on this environment: no signed build without a maintainer approving the run.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Put the tag version into package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}" bun -e '
            const f = Bun.file("package.json");
            const pkg = await f.json();
            pkg.version = process.env.VERSION;
            await Bun.write(f, JSON.stringify(pkg, null, 2) + "\n");
          '
          grep -m1 '"version"' package.json

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bun run build
          bun run build:arm
          mkdir release
          mv dist/pano release/pano-linux-x64
          mv dist/pano-arm64 release/pano-linux-arm64
          cd release
          # The tag inside the signed file: an old signed release cannot pass for another one.
          printf '# pano %s\n' "$TAG" > SHA256SUMS
          sha256sum pano-linux-x64 pano-linux-arm64 >> SHA256SUMS
          cat SHA256SUMS

      # Ed25519 over SHA256SUMS; pano update --latest and install.sh refuse a release
      # without it. The public half is src/shared/release-key.ts.
      - name: Sign SHA256SUMS
        env:
          PANO_RELEASE_KEY: ${{ secrets.PANO_RELEASE_KEY }}
        run: |
          [ -n "$PANO_RELEASE_KEY" ] || { echo "the PANO_RELEASE_KEY secret is not set" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PANO_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.key" -rawin -in release/SHA256SUMS -out release/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release.key"
          bun -e '
            const { signedBy } = await import("./src/release.ts");
            const sums = await Bun.file("release/SHA256SUMS").bytes();
            const sig = await Bun.file("release/SHA256SUMS.sig").bytes();
            if (!signedBy(sums, sig)) throw new Error("the signature does not match src/shared/release-key.ts");
          '

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/pano-linux-x64 release/pano-linux-arm64 release/SHA256SUMS release/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes

      # install.sh without PANO_VERSION refuses releases older than MIN_VERSION: a validly signed
      # old release cannot be served as "latest". Raised to each new release on main (never lowered).
      # A protected main that refuses the push only costs a warning: bump MIN_VERSION by hand then.
      - name: Raise the installer's minimum version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$AUTH" fetch --depth=1 origin main
          git checkout -q -f -B min-version FETCH_HEAD
          CURRENT="$(sed -n 's/^MIN_VERSION="\([0-9][0-9.]*\)"$/\1/p' install.sh)"
          [ -n "$CURRENT" ] || { echo "::warning::install.sh has no MIN_VERSION line"; exit 0; }
          NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n 1)"
          if [ "$NEWEST" = "$VERSION" ] && [ "$CURRENT" != "$VERSION" ]; then
            sed -i "s/^MIN_VERSION=.*/MIN_VERSION=\"$VERSION\"/" install.sh
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: installer minimum version $VERSION" install.sh
            git -c "http.extraheader=$AUTH" push origin HEAD:main || echo "::warning::could not push the MIN_VERSION bump to main; set MIN_VERSION=\"$VERSION\" in install.sh by hand"
          else
            echo "MIN_VERSION stays $CURRENT"
          fi
