serverName                lsws
user                      nobody
group                     nobody

listener Default{
  address                 *:80
  secure                  0
  map                     shop.example shop.example, www.shop.example, *.shop.example, *
  map                     api.example.net api.example.net, www.api.example.net
  map                     blog.example.org blog.example.org
}

listener SSL {
  address                 *:443
  secure                  1
  keyFile                 /root/.acme.sh/certs/default/default.key
  certFile                /root/.acme.sh/certs/default/default.crt
  map                     shop.example shop.example, www.shop.example, *.shop.example, *
  map                     api.example.net api.example.net, www.api.example.net
  map                     blog.example.org blog.example.org
}

listener SSL IPv6 {
  address                 [ANY]:443
  secure                  1
  map                     shop.example shop.example, www.shop.example, *.shop.example, *
}

virtualhost shop.example {
  vhRoot                  /home/shop.example
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

virtualhost api.example.net {
  vhRoot                  /home/api.example.net
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

virtualhost blog.example.org {
  vhRoot                  /home/blog.example.org
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

virtualhost Example {
  vhRoot                  Example/
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhconf.conf
}
