docRoot                   /home/shop.example/public_html
vhDomain                  shop.example
vhAliases                 www.shop.example, *.shop.example
enableGzip                1

extprocessor pos {
  type                    proxy
  address                 127.0.0.1:3000
  maxConns                100
}

extprocessor online {
  type                    proxy
  address                 127.0.0.1:3001
  maxConns                100
}

context /online {
  type                    proxy
  handler                 online
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 pos
  addDefaultCharset       off
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/shop.example/privkey.pem
  certFile                /etc/letsencrypt/live/shop.example/fullchain.pem
  certChain               1
}
