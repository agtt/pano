docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
enableGzip                1

index  {
  useServer               0
  indexFiles              index.php, index.html
}

scripthandler  {
  add                     lsapi:blog1234 php
}

extprocessor blog1234 {
  type                    lsapi
  address                 UDS://tmp/lshttpd/blog1234.sock
  maxConns                10
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  extUser                 blog1234
  extGroup                blog1234
}

rewrite  {
 enable                  1
  autoLoadHtaccess        1
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/blog.example.org/privkey.pem
  certFile                /etc/letsencrypt/live/blog.example.org/fullchain.pem
  certChain               1
}
