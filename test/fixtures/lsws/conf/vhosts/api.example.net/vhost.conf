docRoot                   $VH_ROOT/html
vhDomain                  api.example.net
vhAliases                 www.api.example.net
enableGzip                1

extprocessor api {
  type                    proxy
  address                 127.0.0.1:3100
  maxConns                100
}

extprocessor api-hook {
  type                    proxy
  address                 127.0.0.1:3101
  maxConns                4
}

context /__deploy/github {
  type                    proxy
  handler                 api-hook
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 api
  addDefaultCharset       off
}

rewrite  {
  enable                  1

  rules                   <<<END_rules
RewriteEngine On
RewriteCond %{HTTP_HOST} ^www\.api\.example\.net$ [NC]
RewriteRule ^/?(.*)$ https://api.example.net/$1 [R=301,L]
END_rules
}

vhssl  {
  keyFile                 /opt/api/tls/origin.key
  certFile                /opt/api/tls/origin.pem
  certChain               1
}
